name: Build Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      BANGUMI_APP_ID: ${{ secrets.BANGUMI_APP_ID }}
      BANGUMI_APP_SECRET: ${{ secrets.BANGUMI_APP_SECRET }}
      MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
      PUB_HOSTED_URL: https://pub.dev
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 初始化 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 初始化 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: '3.49.0-0.2.pre'
          architecture: x64

      - name: 检查环境
        run: flutter doctor

      - name: 按锁文件从官方源拉取依赖
        shell: pwsh
        run: |
          # 仅在 CI 中映射包源地址，保留锁定版本和内容哈希。
          $lockPath = Join-Path $env:GITHUB_WORKSPACE 'pubspec.lock'
          $lockContent = [IO.File]::ReadAllText($lockPath, [Text.Encoding]::UTF8)
          $lockContent = $lockContent.Replace(
            'https://pub.flutter-io.cn',
            $env:PUB_HOSTED_URL
          )
          [IO.File]::WriteAllText(
            $lockPath,
            $lockContent,
            [Text.UTF8Encoding]::new($false)
          )
          flutter pub get --enforce-lockfile

      - name: 准备推理资源
        shell: pwsh
        run: ./scripts/prepare_playback_inference.ps1

      - name: 构建下载引擎
        shell: pwsh
        working-directory: repos/bt_download
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'VCPKG_INSTALLATION_ROOT is not available'
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-x64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-x64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install out/build/windows-x64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $runtimePath = (Resolve-Path 'out/install/windows-x64-release').Path
          "BT_DOWNLOAD_RUNTIME_DIR=$runtimePath" >> $env:GITHUB_ENV

      - name: 准备 Flutter 构建参数
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BANGUMI_APP_ID) -or
              [string]::IsNullOrWhiteSpace($env:BANGUMI_APP_SECRET)) {
            throw 'BANGUMI_APP_ID and BANGUMI_APP_SECRET must be configured.'
          }
          $defines = [ordered]@{
            BANGUMI_APP_ID = $env:BANGUMI_APP_ID
            BANGUMI_APP_SECRET = $env:BANGUMI_APP_SECRET
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            'build_config.json',
            $defines,
            [Text.UTF8Encoding]::new($false)
          )

      - name: 打包并压缩
        shell: pwsh
        run: |
          flutter build windows --release --no-pub --dart-define-from-file=build_config.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify_windows_bundle.ps1 `
            -BundlePath build/windows/x64/runner/Release `
            -EngineRuntimePath $env:BT_DOWNLOAD_RUNTIME_DIR
          Compress-Archive -Path ./build/windows/x64/runner/Release/* -DestinationPath "BangumiToday_${env:RELEASE_VERSION}.zip"

      - name: 准备 MSIX 签名证书
        shell: pwsh
        env:
          SIGN_SECRET: ${{ secrets.SIGN_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            throw 'MSIX_CERTIFICATE_BASE64 must be configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGN_SECRET)) {
            throw 'SIGN_SECRET must be configured.'
          }
          [IO.File]::WriteAllBytes(
            'build_certificate.pfx',
            [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64)
          )
          $pfxPath = (Resolve-Path 'build_certificate.pfx').Path
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:SIGN_SECRET
          )
          try {
            [IO.File]::WriteAllBytes(
              'BTMuli.cer',
              $cert.Export(
                [Security.Cryptography.X509Certificates.X509ContentType]::Cert
              )
            )
            Write-Host (
              "Exported public certificate $($cert.Thumbprint) ($($cert.Subject))"
            )
          } finally {
            $cert.Dispose()
          }

      - name: 打包msix
        run: >
          dart run msix:create
          -n "BangumiToday_${{ env.RELEASE_VERSION }}"
          --build-windows false
          --certificate-path build_certificate.pfx
          -p ${{ secrets.SIGN_SECRET }}

      - name: 打包msix-Store
        run: >
          dart run msix:create
          --store true
          -i "27581BTMuli.BangumiToday"
          -b "CN=5FE33156-C3CE-4E71-A036-81BAA99521CB"
          -n "BangumiToday_${{ env.RELEASE_VERSION }}_Store"
          --build-windows false
          --certificate-path build_certificate.pfx
          -p ${{ secrets.SIGN_SECRET }}

      - name: 清理发布临时文件
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'build_config.json') {
            Remove-Item -LiteralPath 'build_config.json' -Force
          }
          if (Test-Path -LiteralPath 'build_certificate.pfx') {
            Remove-Item -LiteralPath 'build_certificate.pfx' -Force
          }

      - name: 上传文件
        uses: actions/upload-artifact@v4
        with:
          name: BangumiToday_${{ env.RELEASE_VERSION }}
          path: |
            BangumiToday_${{ env.RELEASE_VERSION }}.zip
            BangumiToday_${{ env.RELEASE_VERSION }}.msix
            BangumiToday_${{ env.RELEASE_VERSION }}_Store.msix
            BTMuli.cer

      - name: 发行Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: true
          generate_release_notes: false
          files: |
            BangumiToday_${{ env.RELEASE_VERSION }}.zip
            BangumiToday_${{ env.RELEASE_VERSION }}.msix
            BangumiToday_${{ env.RELEASE_VERSION }}_Store.msix
            BTMuli.cer
