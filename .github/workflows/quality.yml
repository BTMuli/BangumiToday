name: Quality Gate

# 可复用质量门禁：PR/主分支 CI 与发布流程共用同一套检查。
# 外部下载引擎依赖策略：`repos/bt_download` 子模块在 Debug 构建中由 CMake
# 托管模式自动编译（vcpkg 来自 runner），因此质量门禁直接验证 Debug bundle；
# 发布流程改用 `BT_DOWNLOAD_RUNTIME_DIR` 注入的 Release 安装目录做 SHA-256 全量比对。
# 平台专属测试（下载引擎进程集成测试）通过 `BT_DOWNLOAD_TEST_ENGINE` 环境变量
# 隔离，默认 `flutter test` 不执行。
on:
  workflow_call:

jobs:
  quality:
    name: Flutter quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test test_driver

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings lib test test_driver

      - name: Test
        run: flutter test

      - name: Build Windows debug
        run: flutter build windows --debug

      - name: Verify Windows bundle
        shell: pwsh
        run: ./scripts/verify_windows_bundle.ps1 -BundlePath build/windows/x64/runner/Debug

  desktop-journey:
    name: Desktop integration journey
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Run desktop journey
        run: flutter test integration_test/app_boot_test.dart -d windows --dart-define=BANGUMI_INTEGRATION_TEST=true
