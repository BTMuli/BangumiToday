name: 功能建议
description: 描述使用场景、目标与期望行为
title: "[Feat] "
labels:
  - Feature
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue 和 Discussion，并遵守[行为准则](https://github.com/BTMuli/BangumiToday/blob/master/CODE_OF_CONDUCT.md)。
        本项目由个人维护，建议不保证实现时间。较大功能、架构调整或新增原生依赖，建议先讨论方向。
        请勿填写 Token、私人订阅链接或其他敏感信息。
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue 和 Discussion，未找到相同建议或已在下方说明关联记录
          required: true
  - type: textarea
    id: description
    attributes:
      label: 使用场景与问题
      description: 说明当前流程遇到的具体问题，以及现有替代做法
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 描述希望如何改进；如有可参考的方案或取舍，请一并说明
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本与平台
      placeholder: "例如：设置中显示的版本 / Windows x64 或 macOS"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 相关 Issue、Discussion、参考资料或已脱敏的截图
    validations:
      required: false
